<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情日记 | 仁归·自然之梦</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text y='32' font-size='30'>📝</text></svg>">
    <style>
        :root {
            --green-50: #f2f8f3;
            --green-100: #e0efe4;
            --green-200: #c2dfc9;
            --green-500: #4a8c5c;
            --green-600: #3d704a;
            --green-700: #345c3e;
            --warm-white: #fefdfb;
            --text-primary: #2d3a2d;
            --text-secondary: #5a6b5a;
            --text-muted: #8a9a8a;
            --shadow-sm: 0 1px 3px rgba(45,58,45,0.06);
            --shadow-md: 0 4px 16px rgba(45,58,45,0.08);
            --shadow-lg: 0 8px 32px rgba(45,58,45,0.10);
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
            background: linear-gradient(175deg, #eaf5ec, #f5f9f6, #f8faf7);
            background-attachment: fixed;
            min-height:100vh; color:var(--text-primary);
            -webkit-font-smoothing:antialiased;
        }
        .bg-orb {
            position:fixed; border-radius:50%; pointer-events:none; z-index:0; opacity:0.28; filter:blur(70px);
        }
        .bg-orb--1 {
            width:260px; height:260px;
            background:radial-gradient(circle, rgba(139,175,145,0.4) 0%, transparent 70%);
            top:-6%; left:-4%;
            animation:orbFloat 20s ease-in-out infinite;
        }
        @keyframes orbFloat {
            0%,100%{transform:translate(0,0) scale(1);}
            50%{transform:translate(30px,-20px) scale(1.1);}
        }
        .nav-bar {
            position:sticky; top:0; z-index:100;
            background:rgba(254,253,251,0.85);
            backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(180,200,185,0.3);
            padding:0 20px;
        }
        .nav-inner {
            max-width:1100px; margin:0 auto;
            display:flex; align-items:center; justify-content:space-between; height:56px;
        }
        .nav-brand { text-decoration:none; color:var(--green-700); font-weight:700; font-size:1.2rem; }
        .nav-links { display:flex; gap:18px; list-style:none; }
        .nav-links a { text-decoration:none; color:var(--text-secondary); font-size:0.9rem; transition:color 0.2s; }
        .nav-links a:hover { color:var(--green-500); }

        .main-wrap {
            position:relative; z-index:1; max-width:700px; margin:0 auto; padding:30px 20px 50px;
        }
        .card {
            background:rgba(255,255,255,0.85); backdrop-filter:blur(14px);
            border-radius:var(--radius-xl); padding:30px 24px;
            box-shadow:var(--shadow-lg); border:1px solid rgba(180,200,185,0.3);
        }
        .card h2 { text-align:center; color:var(--green-700); margin-bottom:20px; font-size:1.5rem; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:600; color:var(--green-600); margin-bottom:6px; font-size:0.9rem; }
        .form-group textarea {
            width:100%; min-height:120px; padding:14px; border:1px solid var(--green-200);
            border-radius:var(--radius-md); font-size:0.95rem; resize:vertical;
            font-family:inherit; background:var(--warm-white);
        }
        .mood-select {
            display:flex; gap:8px; flex-wrap:wrap;
        }
        .mood-btn {
            padding:8px 16px; border-radius:20px; border:2px solid var(--green-200);
            background:#fff; cursor:pointer; font-size:0.9rem; transition:all 0.2s;
        }
        .mood-btn:hover, .mood-btn.active {
            background:var(--green-100); border-color:var(--green-500); color:var(--green-600);
        }
        .btn {
            display:inline-block; padding:12px 28px; font-size:0.95rem; font-weight:600;
            border-radius:28px; cursor:pointer; transition:all 0.3s; border:none;
            background:linear-gradient(135deg, var(--green-500), var(--green-600));
            color:#fff; box-shadow:0 4px 14px rgba(74,140,92,0.3);
        }
        .btn:hover { box-shadow:0 6px 22px rgba(74,140,92,0.42); transform:translateY(-2px); }
        .diary-list { margin-top:30px; }
        .diary-item {
            background:#fff; border-radius:var(--radius-md); padding:18px;
            margin-bottom:12px; box-shadow:var(--shadow-sm);
            border-left:4px solid var(--green-400);
        }
        .diary-item .meta { font-size:0.8rem; color:var(--text-muted); margin-bottom:6px; }
        .diary-item .content { font-size:0.95rem; line-height:1.7; }
        .back-row { text-align:center; margin-top:24px; }
        @media (max-width:500px) {
            .card { padding:20px 14px; }
            .nav-links { gap:10px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb--1"></div>
    <nav class="nav-bar">
        <div class="nav-inner">
            <a href="index.html" class="nav-brand">🌿  仁归 · 自然之梦
</a>
              <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="brand-home.html">品牌</a></li>
                <li><a href="ai-companion.html">AI陪伴</a></li>
                <li><a href="diary-index.html">日记</a></li>
                <li><a href="sas-test.html">测评</a></li>
                <li><a href="relax-game.html">减压</a></li>
            </ul>
        </div>
      </nav>

    <div class="main-wrap">
        <div class="card">
            <h2>📝 心情日记</h2>
            <div class="form-group">
                <label>今天的心情</label>
                <div class="mood-select" id="moodGroup">
                    <span class="mood-btn active" data-mood="5">😊 很好</span>
                    <span class="mood-btn" data-mood="4">🙂 不错</span>
                    <span class="mood-btn" data-mood="3">😐 一般</span>
                    <span class="mood-btn" data-mood="2">😔 低落</span>
                    <span class="mood-btn" data-mood="1">😢 难过</span>
                </div>
            </div>
            <div class="form-group">
                <label>写点什么</label>
                <textarea id="diaryContent" placeholder="今天发生了什么呢……"></textarea>
            </div>
            <button class="btn" onclick="saveDiary()">💾 保存日记</button>

            <div class="diary-list" id="diaryList">
                <p style="color:var(--text-muted);text-align:center;">日记列表加载中……</p>
            </div>
        </div>
        <div class="back-row">
            <a href="index.html" class="btn" style="background:#fff;color:var(--green-600);border:2px solid var(--green-200);">← 返回首页</a>
        </div>
    </div>

    <script>
        let selectedMood = 5;
        const moodBtns = document.querySelectorAll('.mood-btn');
        moodBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                moodBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedMood = parseInt(this.dataset.mood);
            });
        });

        function saveDiary() {
            const content = document.getElementById('diaryContent').value.trim();
            if (!content) { alert('请写点内容吧~'); return; }
            fetch('/api/diary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content, mood_score: selectedMood })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    alert('日记保存成功 🌱');
                    document.getElementById('diaryContent').value = '';
                    loadDiaries();
                } else {
                    alert('保存失败：' + data.message);
                }
            })
            .catch(() => alert('网络连接失败，请确认后端已启动'));
        }

        function loadDiaries() {
            fetch('/api/diary')
            .then(r => r.json())
            .then(data => {
                const list = document.getElementById('diaryList');
                if (!data.data || data.data.length === 0) {
                    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;">还没有日记，写一篇吧 🌸</p>';
                    return;
                }
                const moodEmoji = {5:'😊',4:'🙂',3:'😐',2:'😔',1:'😢'};
                list.innerHTML = data.data.map(d => `
                    <div class="diary-item">
                        <div class="meta">${moodEmoji[d.mood_score]||''} 心情指数 ${d.mood_score}/5 · ${new Date(d.created_at).toLocaleString()}</div>
                        <div class="content">${escapeHtml(d.content)}</div>
                    </div>
                `).join('');
            })
            .catch(() => {
                document.getElementById('diaryList').innerHTML = '<p style="color:var(--text-muted);text-align:center;">无法加载日记（请确认后端已启动）</p>';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadDiaries();
    </script>
</body>
</html>
