<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="仁归 · 静心放松 — 呼吸圈与释忧气球，缓释环境压力。">
    <meta name="theme-color" content="#5BAA8E">
    <title>仁归 · 静心放松</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <style>
        :root {
            --rg-primary: #5BAA8E;
            --rg-primary-light: #7BC8A4;
            --rg-primary-dark: #3D7A64;
            --rg-bg: #F5FBF7;
            --rg-card-bg: #FFFFFF;
            --rg-text: #2D3E35;
            --rg-text-soft: #6B7F73;
            --rg-border: #D4E8DD;
            --rg-shadow: 0 6px 24px rgba(91, 170, 142, 0.12);
            --rg-radius: 20px;
            --rg-radius-sm: 12px;
            --rg-font: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            --rg-transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--rg-font);
            background: var(--rg-bg);
            color: var(--rg-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image:
                radial-gradient(ellipse at 15% 15%, rgba(123, 200, 164, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 70%, rgba(91, 170, 142, 0.05) 0%, transparent 55%);
        }
        .rg-nav {
            width: 100%; max-width: 1200px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 28px; position: relative; z-index: 10;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--rg-border);
        }
        .rg-nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--rg-text); font-weight: 700; font-size: 1.3rem; }
        .rg-nav-logo svg { width: 36px; height: 36px; }
        .rg-nav-links { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        .rg-nav-links a { text-decoration: none; color: var(--rg-text-soft); font-size: 0.85rem; font-weight: 500; transition: var(--rg-transition); }
        .rg-nav-links a:hover { color: var(--rg-primary); }
        .rg-nav-links a.rg-active { color: var(--rg-primary); font-weight: 700; }
        .rg-main { width: 100%; max-width: 800px; flex: 1; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 18px; }
        .rg-page-title { text-align: center; padding: 12px 0 4px; }
        .rg-page-title h1 { font-size: 1.7rem; font-weight: 800; color: var(--rg-primary-dark); letter-spacing: 0.06em; margin-bottom: 4px; }
        .rg-page-title p { color: var(--rg-text-soft); font-size: 0.9rem; }

        /* 每日箴言 */
        .rg-daily-quote {
            text-align: center; padding: 12px 20px;
            background: rgba(123, 200, 164, 0.08);
            border-radius: var(--rg-radius-sm); border: 1px solid var(--rg-border);
            color: var(--rg-text-soft); font-size: 0.9rem;
        }

        /* 游戏Tab导航 */
        .rg-game-tabs {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            padding: 8px; background: rgba(255,255,255,0.7);
            border-radius: var(--rg-radius-sm); border: 1px solid var(--rg-border);
        }
        .rg-game-tab {
            padding: 8px 16px; border-radius: 25px; border: 1.5px solid var(--rg-border);
            background: transparent; cursor: pointer; font-size: 0.85rem;
            font-family: var(--rg-font); color: var(--rg-text-soft);
            transition: var(--rg-transition); white-space: nowrap;
        }
        .rg-game-tab:hover { border-color: var(--rg-primary-light); color: var(--rg-primary); }
        .rg-game-tab.rg-active {
            background: var(--rg-primary); color: #fff;
            border-color: var(--rg-primary); box-shadow: 0 2px 10px rgba(91, 170, 142, 0.3);
        }

        /* 游戏面板 */
        .rg-game-panel {
            background: var(--rg-card-bg); border-radius: var(--rg-radius);
            box-shadow: var(--rg-shadow); border: 1px solid var(--rg-border);
            padding: 18px; display: none; animation: rgFadeIn 0.4s ease;
        }
        @keyframes rgFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .rg-game-panel h3 { color: var(--rg-primary-dark); margin-bottom: 10px; font-size: 1.05rem; }
        .rg-game-panel canvas { width: 100%; border-radius: var(--rg-radius-sm); border: 1px solid #e0e8e4; cursor: pointer; }

        /* 输入行 */
        .rg-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .rg-input-row input {
            flex: 1; padding: 10px 16px; border: 2px solid var(--rg-border);
            border-radius: 25px; font-size: 0.85rem; font-family: var(--rg-font);
            outline: none; background: #F8FAF9; transition: var(--rg-transition);
        }
        .rg-input-row input:focus { border-color: var(--rg-primary-light); box-shadow: 0 0 0 3px rgba(91, 170, 142, 0.08); }
        .rg-input-row button {
            padding: 10px 22px; border-radius: 25px; background: var(--rg-primary);
            color: #fff; border: none; font-size: 0.9rem; font-weight: 600;
            cursor: pointer; font-family: var(--rg-font); transition: var(--rg-transition);
        }
        .rg-input-row button:hover { background: var(--rg-primary-dark); }

        /* 计数器 */
        .rg-counter {
            text-align: center; font-size: 1rem; color: var(--rg-primary-dark);
            font-weight: 600; margin-top: 8px;
        }

        /* 按钮 */
        .rg-action-btn {
            padding: 8px 18px; border-radius: 25px; border: 1.5px solid var(--rg-border);
            background: transparent; cursor: pointer; font-size: 0.8rem;
            font-family: var(--rg-font); color: var(--rg-text-soft); transition: var(--rg-transition);
            margin-top: 8px;
        }
        .rg-action-btn:hover { border-color: var(--rg-primary-light); color: var(--rg-primary); }

        .rg-footer { width: 100%; max-width: 1200px; text-align: center; padding: 16px 28px; color: var(--rg-text-soft); font-size: 0.78rem; border-top: 1px solid var(--rg-border); margin-top: auto; }
        .rg-footer a { color: var(--rg-primary); text-decoration: none; }

        @media (max-width: 768px) {
            .rg-nav { padding: 12px 14px; flex-direction: column; gap: 8px; }
            .rg-main { padding: 10px 12px 20px; }
            .rg-game-tab { padding: 6px 12px; font-size: 0.75rem; }
            .rg-game-panel { padding: 12px; }
        }
    </style>
</head>
<body>

            仁归
        </a>
        <div class="rg-nav-links">
            <a href="index.html">首页</a>

            <a href="sas-test.html">对话</a>
            <a href="relax-game.html" class="rg-active">🎮 放松</a>
        </div>
    </nav>

    <main class="rg-main">
        <div class="rg-page-title">
            <h1>🎮 静心放松</h1>
            <p>用呼吸和释放，缓释环境压力与情绪</p>
        </div>

        <!-- 每日箴言 -->
        <div class="rg-daily-quote" id="dailyQuote">加载中…</div>

        <!-- 游戏Tab导航 -->
        <div class="rg-game-tabs">
            <button class="rg-game-tab rg-active" data-game="breath">🌸 静心呼吸圈</button>
            <button class="rg-game-tab" data-game="balloon">🎈 释忧气球</button>
        </div>

        <!-- 呼吸圈面板 -->
        <div class="rg-game-panel" id="panel-breath" style="display:block;">
            <h3>🌸 静心呼吸圈</h3>
            <p style="font-size:0.85rem;color:var(--rg-text-soft);margin-bottom:10px;">
                跟随圆环的节奏呼吸：吸气（4秒）→ 屏息（4秒）→ 呼气（6秒）。每完成一轮，开一朵花。
            </p>
            <canvas id="breathCanvas" style="height:320px;"></canvas>
            <div class="rg-counter" id="flowerCount">🌸 × 0</div>
            <div style="display:flex;justify-content:center;">
                <button class="rg-action-btn" id="breathResetBtn">🔄 重新开始</button>
            </div>
        </div>

        <!-- 释忧气球面板 -->
        <div class="rg-game-panel" id="panel-balloon">
            <h3>🎈 释忧气球</h3>
            <p style="font-size:0.85rem;color:var(--rg-text-soft);margin-bottom:10px;">
                写下烦恼，生成气球。点击气球放飞它，让烦恼随风飘走。
            </p>
            <div class="rg-input-row">
                <input type="text" id="worryInput" placeholder="写下你的烦恼…" autocomplete="off">
                <button id="worryAddBtn">🎈 生成</button>
            </div>
            <canvas id="balloonCanvas" style="height:300px;"></canvas>
            <div class="rg-counter" id="balloonCounter">今日已放飞：0 个气球</div>
            <div style="display:flex;justify-content:center;">
                <button class="rg-action-btn" id="balloonResetBtn">🔄 清空气球</button>
            </div>
        </div>
    </main>

    <footer class="rg-footer">
        <p>🌿 仁归 · 静心放松 · <a href="../../markdown.md">开源誓约</a> · MIT License</p>
    </footer>

</body>
