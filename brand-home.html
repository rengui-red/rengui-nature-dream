<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仁归 · 自然之梦 | 品牌首页</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><text y='32' font-size='30'>🌿</text></svg>">
    <style>
        :root {
            --green-50: #f2f8f3;
            --green-100: #e0efe4;
            --green-200: #c2dfc9;
            --green-400: #6fad80;
            --green-500: #4a8c5c;
            --green-600: #3d704a;
            --green-700: #345c3e;
            --green-800: #2d4a34;
            --warm-white: #fefdfb;
            --text-primary: #2d3a2d;
            --text-secondary: #5a6b5a;
            --text-muted: #8a9a8a;
            --shadow-sm: 0 1px 3px rgba(45,58,45,0.06);
            --shadow-md: 0 4px 16px rgba(45,58,45,0.08);
            --shadow-lg: 0 8px 32px rgba(45,58,45,0.10);
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
            background: linear-gradient(175deg, #eaf5ec 0%, #f5f9f6 20%, #f8faf7 50%, #f0f7f2 80%, #eef6ef 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        .bg-orb {
            position: fixed; border-radius:50%; pointer-events:none; z-index:0; opacity:0.3; filter:blur(70px);
        }
        .bg-orb--1 {
            width:280px; height:280px;
            background:radial-gradient(circle, rgba(139,175,145,0.45) 0%, transparent 70%);
            top:-8%; left:-5%;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .bg-orb--2 {
            width:220px; height:220px;
            background:radial-gradient(circle, rgba(180,200,170,0.4) 0%, transparent 70%);
            bottom:-10%; right:-5%;
            animation: orbFloat 24s ease-in-out infinite reverse;
        }
        @keyframes orbFloat {
            0%,100%{ transform:translate(0,0) scale(1); }
            33%{ transform:translate(40px,-25px) scale(1.1); }
            66%{ transform:translate(-25px,30px) scale(0.9); }
        }
        .nav-bar {
            position:sticky; top:0; z-index:100;
            background:rgba(254,253,251,0.85);
            backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
            border-bottom:1px solid rgba(180,200,185,0.3);
            padding:0 20px;
        }
        .nav-inner {
            max-width:1100px; margin:0 auto;
            display:flex; align-items:center; justify-content:space-between; height:56px;
        }
        .nav-brand {
            display:flex; align-items:center; gap:8px;
            text-decoration:none; color:var(--green-700); font-weight:700; font-size:1.2rem;
        }
        .nav-links { display:flex; gap:20px; list-style:none; }
        .nav-links a {
            text-decoration:none; color:var(--text-secondary); font-size:0.9rem; font-weight:500;
            transition:color 0.2s;
        }
        .nav-links a:hover { color:var(--green-500); }

        .main-content { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:40px 24px 60px; }

        .hero {
            text-align:center; padding:40px 20px 30px;
        }
        .hero h1 {
            font-size:clamp(1.8rem,4vw,2.6rem); font-weight:700;
            color:var(--green-800); letter-spacing:0.04em; margin-bottom:12px;
        }
        .hero p {
            font-size:1rem; color:var(--text-secondary); max-width:500px;
            margin:0 auto 28px; line-height:1.8;
        }
        .hero-actions {
            display:flex; flex-wrap:wrap; gap:14px; justify-content:center;
        }
        .btn {
            display:inline-flex; align-items:center; gap:8px;
            padding:13px 28px; font-size:0.95rem; font-weight:600;
            letter-spacing:0.03em; border-radius:28px; cursor:pointer;
            text-decoration:none; transition:all 0.3s; border:none;
        }
        .btn-primary {
            background:linear-gradient(135deg, var(--green-500), var(--green-600));
            color:#fff; box-shadow:0 4px 16px rgba(74,140,92,0.3);
        }
        .btn-primary:hover { box-shadow:0 6px 24px rgba(74,140,92,0.42); transform:translateY(-2px); }
        .btn-outline {
            background:#fff; color:var(--green-600);
            border:2px solid var(--green-200); box-shadow:var(--shadow-sm);
        }
        .btn-outline:hover { border-color:var(--green-500); box-shadow:var(--shadow-md); transform:translateY(-1px); }

        .features-grid {
            display:grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap:20px; margin-top:30px;
        }
        .feature-card {
            background:#fff; border-radius:var(--radius-lg); padding:28px 22px;
            text-align:center; border:1px solid rgba(180,200,185,0.25);
            box-shadow:var(--shadow-sm); transition:all var(--transition-smooth);
            text-decoration:none; color:inherit; display:block;
        }
        .feature-card:hover {
            box-shadow:var(--shadow-lg); transform:translateY(-3px); border-color:var(--green-200);
        }
        .feature-card .icon { font-size:2rem; margin-bottom:10px; display:block; }
        .feature-card h3 { font-size:1.05rem; font-weight:600; color:var(--green-700); margin-bottom:6px; }
        .feature-card p { font-size:0.85rem; color:var(--text-muted); line-height:1.5; }

        .site-footer {
            text-align:center; padding:24px; border-top:1px solid rgba(180,200,185,0.3);
            position:relative; z-index:1;
        }
        .site-footer p { font-size:0.8rem; color:var(--text-muted); }

        @media (max-width:600px) {
            .features-grid { grid-template-columns:1fr 1fr; gap:12px; }
            .feature-card { padding:20px 14px; }
            .nav-links { gap:12px; }
        }
        @media (max-width:400px) {
            .features-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
